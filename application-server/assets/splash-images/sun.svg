<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#FFF6DA"/>
      <stop offset="55%" stop-color="#FFD9A0"/>
      <stop offset="100%" stop-color="#FF8F6B"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFEE58"/>
      <stop offset="75%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#sky)"/>

  <circle cx="200" cy="200" r="120" fill="#FFEB3B" opacity="0.35" filter="url(#glow)"/>

  <g fill="url(#ray)">
    <g transform="rotate(0 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(22.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(45 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(67.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(90 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(112.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(135 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(157.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(180 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(202.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(225 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(247.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(270 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(292.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
    <g transform="rotate(315 200 200)"><rect x="192" y="22" width="16" height="74" rx="8"/></g>
    <g transform="rotate(337.5 200 200)"><rect x="192" y="52" width="16" height="44" rx="8"/></g>
  </g>

  <circle cx="200" cy="200" r="100" fill="url(#sunBody)"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3"/>
</svg>
